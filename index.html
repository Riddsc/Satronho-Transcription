<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcriptor IA Local</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Transcriptor IA 🧠</h1>
            <p>100% Privado y Offline (Español e Inglés)</p>
        </header>

        <section class="status-panel">
            <div id="status-indicator">🔴 Esperando cargar el modelo...</div>
        </section>

        <section class="controls">
            <!-- Botón para descargar/cargar el modelo en la memoria -->
            <button id="btn-load" class="btn primary">Cargar Cerebro IA</button>
            <button id="btn-record" class="btn danger" disabled>🎙️ Grabar</button>
            <button id="btn-stop" class="btn secondary" disabled>⏹️ Detener</button>
        </section>

        <section class="output-panel">
            <h2>Transcripción:</h2>
            <div id="transcript-box" class="transcript-box">
                Aquí aparecerá tu texto...
            </div>
        </section>
    </main>

    <!-- Usamos type="module" porque usamos JS moderno -->
    <script type="module" src="app.js"></script>
</body>
</html>

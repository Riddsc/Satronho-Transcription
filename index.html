<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transcriptor Pro Nativo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Transcriptor Pro 🎙️</h1>
            <p>Precisión Extrema: Español e Inglés</p>
        </header>

        <section class="config-panel">
            <label for="language-select">Idioma de la conversación:</label>
            <select id="language-select">
                <option value="es-ES" selected>Español (España / LATAM)</option>
                <option value="en-US">Inglés (Estados Unidos)</option>
            </select>
        </section>

        <section class="controls">
            <button id="btn-record" class="btn primary">Iniciar Transcripción</button>
            <button id="btn-stop" class="btn danger" disabled>Detener</button>
            <button id="btn-clear" class="btn secondary">Limpiar Texto</button>
        </section>

        <section class="status-panel">
            <div id="status-indicator">🔴 Inactivo</div>
        </section>

        <section class="output-panel">
            <div id="transcript-box" class="transcript-box">
                <span id="final-text"></span>
                <span id="interim-text" class="interim"></span>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
